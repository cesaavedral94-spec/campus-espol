<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPOL · Inicio</title>
<style>
  /* ---------------------------------------------------------------
     Tipografía institucional: Artifakt Element.
     Es una fuente con licencia, no se puede empaquetar dentro del HTML.
     Si la tenés instalada en tu equipo, se usa automáticamente.
     Si tenés los archivos (.woff2), descomentá este bloque y ponelos
     en una carpeta ./fonts junto a este archivo:

  @font-face{font-family:"Artifakt Element";font-weight:400;font-style:normal;font-display:swap;
    src:local("Artifakt Element"),url("./fonts/ArtifaktElement-Regular.woff2") format("woff2")}
  @font-face{font-family:"Artifakt Element";font-weight:500;font-style:normal;font-display:swap;
    src:local("Artifakt Element Medium"),url("./fonts/ArtifaktElement-Medium.woff2") format("woff2")}
  @font-face{font-family:"Artifakt Element";font-weight:600;font-style:normal;font-display:swap;
    src:local("Artifakt Element SemiBold"),url("./fonts/ArtifaktElement-SemiBold.woff2") format("woff2")}
  @font-face{font-family:"Artifakt Element";font-weight:700;font-style:normal;font-display:swap;
    src:local("Artifakt Element Bold"),url("./fonts/ArtifaktElement-Bold.woff2") format("woff2")}
  --------------------------------------------------------------- */
  :root{
    --font:"Artifakt Element","Artifakt Legend","Artifakt","Artefakt",
           Inter,Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --bg:#f5f6f8;
    --card:#ffffff;
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#71809b;
    --line:#e6e9ef;
    --line-2:#eef1f6;
    --accent:#4f46e5;
    --accent-soft:#eef0ff;
    --ok:#0e9f6e;
    --ok-soft:#e6f6ef;
    --warn:#c2790a;
    --warn-soft:#fdf3e3;
    --danger:#d64545;
    --danger-soft:#fdeceb;
    --gap:16px;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:11px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.14);
    --shadow-lift:0 2px 4px rgba(16,24,40,.06), 0 18px 40px -18px rgba(16,24,40,.28);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.45;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  ul{margin:0;padding:0;list-style:none}

  .shell{max-width:1180px;margin:0 auto;padding:20px 18px 120px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .brand{display:flex;align-items:center}
  .brand img{height:28px;width:auto;display:block}
  @media (max-width:620px){ .brand img{height:24px} }
  .greet{margin-left:auto;color:var(--muted);font-size:13.5px}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--ink-2);
    transition:background .15s,border-color .15s,transform .1s;
  }
  .icon-btn:hover{background:#fbfbfd;border-color:#d9deea}
  .icon-btn:active{transform:scale(.96)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
  #fixedRow{margin-bottom:var(--gap)}
  .col-2{grid-column:span 2}
  .col-3{grid-column:span 3}
  .col-4{grid-column:span 4}
  .col-5{grid-column:span 5}
  .col-6{grid-column:span 6}
  .col-7{grid-column:span 7}
  .col-8{grid-column:span 8}
  .col-12{grid-column:span 12}

  .section-label{
    grid-column:1/-1;display:flex;align-items:center;gap:10px;
    font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 2px;
  }
  .section-label:after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- card ---------- */
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);
    transition:box-shadow .2s,border-color .2s,transform .2s;
  }
  .card:hover{box-shadow:var(--shadow-lift);border-color:#dfe4ee}
  .card-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding-right:26px}
  .card-title{font-size:13px;font-weight:650;letter-spacing:-.01em}
  .card-sub{font-size:12px;color:var(--muted);font-weight:500}
  .card-head .spacer{flex:1}
  .glyph{
    width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);flex:none;
  }
  .glyph svg{width:15px;height:15px}
  .glyph svg[data-icon="crowd"]{width:18px;height:18px}

  .remove{
    position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:8px;
    display:grid;place-items:center;color:var(--muted);background:#fff;
    border:1px solid var(--line);opacity:0;transform:scale(.85);
    transition:opacity .15s,transform .15s,color .15s,background .15s;
  }
  .card:hover .remove{opacity:1;transform:scale(1)}
  .remove:hover{color:var(--danger);background:var(--danger-soft);border-color:#f6d4d2}
  .remove svg{width:12px;height:12px}

  .pill{
    display:inline-flex;align-items:center;gap:5px;border-radius:999px;
    padding:3px 9px;font-size:11.5px;font-weight:600;
    background:var(--line-2);color:var(--ink-2);
  }
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.danger{background:var(--danger-soft);color:var(--danger)}
  .pill svg{width:11px;height:11px}

  /* ---------- identity ---------- */
  .card{display:flex;flex-direction:column}
  .identity{display:flex;flex-direction:column;gap:14px;flex:1}
  .identity .id-foot{margin-top:auto}
  .push{margin-top:auto}
  .id-top{display:flex;align-items:flex-start;gap:13px}
  .avatar{
    width:56px;height:56px;border-radius:18px;flex:none;overflow:hidden;
    background:#1e1c1c;display:grid;place-items:center;
  }
  .avatar svg{width:100%;height:100%;display:block}
  .id-name{font-size:17px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
  .id-career{color:var(--muted);font-size:13px;margin-top:2px}
  .id-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
  .id-code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    color:var(--ink-2);background:var(--line-2);border-radius:7px;padding:2px 8px;letter-spacing:.04em;
  }
  .id-prog{margin:auto 0}
  .id-prog-top{display:flex;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:7px}
  .id-prog-top b{margin-left:auto;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
  .id-prog .track{margin-top:0;height:6px;border-radius:3px}
  .id-prog-note{font-size:11.5px;color:var(--muted);margin-top:7px}
  .id-foot{
    display:grid;grid-template-columns:repeat(3,1fr);gap:13px 0;
    border-top:1px solid var(--line-2);padding-top:13px;
  }
  .id-stat{padding-left:13px;border-left:1px solid var(--line-2);min-width:0}
  .id-stat:nth-child(3n+1){padding-left:0;border-left:0}
  .id-stat b{display:block;font-size:16px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
  .id-stat span{font-size:11.5px;color:var(--muted);white-space:nowrap}

  /* ---------- mail ---------- */
  .mail-list{display:flex;flex-direction:column;gap:2px;margin:-4px -6px 0}
  .mail-item{
    display:flex;gap:11px;align-items:flex-start;padding:9px 6px;border-radius:12px;
    transition:background .15s;cursor:pointer;text-align:left;width:100%;
  }
  .mail-item:hover{background:#f8f9fc}
  .mail-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
  .mail-dot.read{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
  .mail-body{min-width:0;flex:1}
  .mail-from{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline}
  .mail-from time{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;flex:none}
  .mail-subj{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn-ghost{
    margin-top:10px;width:100%;padding:9px;border-radius:12px;border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;
    justify-content:center;gap:7px;transition:background .15s,border-color .15s;
  }
  .btn-ghost:hover{background:#f8f9fc;border-color:#d9deea}
  .btn-ghost svg{width:13px;height:13px}

  /* ---------- calendar ---------- */
  .btn-today{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px 5px 9px;
    font-size:11.5px;font-weight:650;color:var(--accent);background:var(--accent-soft);
    transition:background .15s,color .15s;
  }
  .btn-today:hover{background:var(--accent);color:#fff}
  .btn-today svg{width:13px;height:13px}
  .btn-today.is-now{background:var(--line-2);color:var(--muted);cursor:default}
  .btn-today.is-now:hover{background:var(--line-2);color:var(--muted)}

  .cal-wrap{position:relative}
  .cal-wrap:after{
    content:"";position:absolute;top:0;right:0;bottom:4px;width:38px;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:0 var(--r-md) var(--r-md) 0;
  }
  .cal-strip{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;
    overscroll-behavior-x:contain;scroll-behavior:auto;cursor:ew-resize;
  }
  .cal-strip::-webkit-scrollbar{display:none}
  .cal-day{
    flex:0 0 100px;min-width:100px;border:1px solid var(--line);border-radius:var(--r-md);
    padding:10px 10px 11px;text-align:left;transition:border-color .15s,background .15s,transform .12s;
    display:flex;flex-direction:column;gap:8px;
  }
  .cal-day:hover{border-color:#c9cfe0}
  .cal-day.is-today{border-color:var(--accent);background:var(--accent-soft)}
  .cal-day.is-sel{background:var(--ink);border-color:var(--ink)}
  .cal-day.is-sel .cal-dow,.cal-day.is-sel .cal-num{color:#fff}
  .cal-day.is-sel .cal-ev{background:rgba(255,255,255,.28);color:#fff}
  .cal-ev.is-task{background:transparent;display:flex;align-items:center;gap:4px}
  .cal-day.is-sel .cal-ev.is-task{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
  .cal-dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
  .cal-num{font-size:21px;font-weight:650;letter-spacing:-.03em;line-height:1}
  .cal-evs{display:flex;flex-direction:column;gap:4px;min-height:26px}
  .cal-ev{
    font-size:10.5px;font-weight:600;border-radius:6px;padding:3px 6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--line-2);color:var(--ink-2);
  }
  .cal-detail{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
  .cal-detail h4{margin:0 0 9px;font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.02em}
  .cal-row{display:flex;align-items:center;gap:11px;padding:7px 0}
  .cal-time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);width:52px;flex:none}
  .cal-bar{width:3px;border-radius:2px;align-self:stretch;flex:none}
  .cal-info b{display:block;font-size:13px;font-weight:600}
  .cal-info span{font-size:11.5px;color:var(--muted)}
  .cal-empty{font-size:12.5px;color:var(--muted);padding:6px 0}

  /* ---------- tasks ---------- */
  .task{
    display:flex;flex-wrap:wrap;align-items:center;gap:0 13px;padding:12px 13px;
    border-radius:var(--r-md);border:1px solid var(--line-2);
    transition:border-color .15s,background .15s;
  }
  .task + .task{margin-top:8px}
  .task:hover{border-color:#d9deea;background:#fcfcfe}
  .task-bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
  .task-main{flex:1 1 auto;min-width:0}
  .task-name{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:7px;align-items:center}
  .task-sub .dot{width:3px;height:3px;border-radius:50%;background:#c3cadb}
  .task-count{
    flex:1 1 100%;text-align:left;margin-top:9px;
    display:flex;align-items:baseline;gap:9px;
  }
  .cd{
    font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:650;letter-spacing:-.02em;
    display:flex;align-items:baseline;gap:3px;
  }
  .cd small{font-size:10.5px;font-weight:600;opacity:.62;margin-right:3px}
  .cd.is-danger{color:var(--danger)}
  .cd.is-warn{color:var(--warn)}
  .cd.is-ok{color:var(--ink)}
  .task-when{font-size:11px;color:var(--muted)}
  .track{height:3px;border-radius:2px;background:var(--line-2);margin-top:10px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:2px}

  /* ---------- subject ---------- */
  .card.subj{padding:13px 14px;border-radius:16px}
  .card.subj .remove{top:7px;right:7px;width:20px;height:20px}
  .card.subj .remove svg{width:10px;height:10px}
  .subj-top{display:flex;align-items:flex-start;gap:7px;padding-right:16px}
  .subj-dot{width:8px;height:8px;border-radius:2.5px;flex:none;margin-top:5px}
  .subj-name{font-size:13.5px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
  .subj-code{font-size:10.5px;color:var(--muted);margin-top:1px;letter-spacing:.02em}
  .subj-mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .mini{
    font-size:10.5px;font-weight:600;border-radius:7px;padding:3px 7px;
    background:var(--line-2);color:var(--ink-2);white-space:nowrap;
  }
  .mini.zero{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
  .subj-foot{
    display:flex;align-items:baseline;gap:6px;margin-top:11px;padding-top:9px;
    border-top:1px solid var(--line-2);font-size:10.5px;color:var(--muted);
  }
  .grade{margin-left:auto;font-weight:650;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}

  /* ---------- prácticas ---------- */
  .prac-days{display:flex;align-items:baseline;gap:5px;margin-top:10px}
  .prac-days b{font-size:26px;font-weight:650;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .prac-days i{font-style:normal;font-size:12px;font-weight:650;opacity:.7}
  .prac-days span{font-size:10.5px;color:var(--muted);margin-left:2px;line-height:1.15}
  .prac-days.is-danger b,.prac-days.is-danger i{color:var(--danger)}
  .prac-days.is-warn b,.prac-days.is-warn i{color:var(--warn)}
  .prac-days.is-ok b,.prac-days.is-ok i{color:var(--ink)}
  .card.subj .track{margin-top:9px}

  /* ---------- groups ---------- */
  .group{display:flex;align-items:center;gap:11px;padding:9px 0}
  .group + .group{border-top:1px solid var(--line-2)}
  .stack{display:flex;flex:none}
  .stack span{
    width:27px;height:27px;border-radius:9px;display:grid;place-items:center;
    font-size:10.5px;font-weight:650;color:#fff;border:2px solid #fff;margin-left:-8px;
  }
  .stack span:first-child{margin-left:0}
  .group-main{flex:1;min-width:0}
  .group-name{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .group-meta{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{
    min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);
    color:#fff;font-size:11px;font-weight:650;display:grid;place-items:center;flex:none;
  }

  /* ---------- add ---------- */
  .add-slot{grid-column:1/-1;display:flex;justify-content:center}
  .add-btn{
    width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--ink-2);
    box-shadow:var(--shadow);transition:all .18s;
  }
  .add-btn svg{width:19px;height:19px}
  .add-btn:hover{border-color:var(--accent);color:#fff;background:var(--accent);transform:scale(1.06)}
  .add-btn:active{transform:scale(.96)}

  .empty{
    grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--r-lg);
    padding:34px;text-align:center;color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.5);
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.34);backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:20px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{
    width:100%;max-width:520px;background:var(--card);border-radius:24px;padding:22px;
    box-shadow:0 30px 70px -20px rgba(15,23,42,.4);transform:translateY(10px) scale(.98);
    transition:transform .2s;max-height:86vh;overflow:auto;
  }
  .overlay.open .modal{transform:none}
  .modal h3{margin:0;font-size:17px;letter-spacing:-.02em}
  .modal p{margin:4px 0 16px;font-size:13px;color:var(--muted)}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .type{
    display:flex;gap:11px;align-items:center;text-align:left;padding:13px;
    border:1px solid var(--line);border-radius:var(--r-md);transition:all .15s;
  }
  .type:hover{border-color:var(--accent);background:var(--accent-soft)}
  .type-txt{min-width:0}
  .type-txt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
  .type-txt span{font-size:11.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
  .type:disabled{opacity:.45;cursor:not-allowed}
  .type:disabled:hover{border-color:var(--line);background:none}

  /* ---------- detalle de tarea ---------- */
  .task[data-task],.cal-row[data-task],.cal-ev.is-task{cursor:pointer}
  .task[data-task]:hover{border-color:#c9cfe0;background:#fbfcff}
  .cal-row[data-task]{border-radius:10px;margin:0 -8px;padding-left:8px;padding-right:8px;transition:background .15s}
  .cal-row[data-task]:hover{background:#f8f9fc}
  .cal-ev.is-task:hover{filter:brightness(.9)}

  .modal.tk{max-width:560px;padding:24px}
  .tk-close{
    position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:10px;
    display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#fff;
    transition:background .15s,color .15s;
  }
  .tk-close:hover{background:#f3f5f9;color:var(--ink)}
  .tk-close svg{width:13px;height:13px}
  .modal.tk{position:relative}

  .tk-kicker{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-right:34px}
  .tk-kicker .subj-dot{width:9px;height:9px;border-radius:3px;margin:0}
  .tk-kicker b{font-size:12.5px;font-weight:650}
  .tk-kicker span{font-size:12px;color:var(--muted)}
  .tk-title{font-size:20px;font-weight:650;letter-spacing:-.03em;line-height:1.25;padding-right:34px}

  .tk-cd{
    margin-top:16px;border-radius:var(--r-md);padding:14px 16px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .tk-cd.is-ok{background:var(--ok-soft)}
  .tk-cd.is-warn{background:var(--warn-soft)}
  .tk-cd.is-danger{background:var(--danger-soft)}
  .tk-cd .cd{font-size:23px}
  .tk-cd .cd small{font-size:13px}
  .tk-cd-lbl{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tk-cd-right{margin-left:auto;text-align:right}
  .tk-cd-right b{display:block;font-size:13px;font-weight:650}
  .tk-cd-right span{font-size:11.5px;color:var(--muted)}

  .tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;
    background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden}
  .tk-cell{background:#fff;padding:11px 13px}
  .tk-cell span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .tk-cell b{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .tk-h{margin:18px 0 7px;font-size:11px;font-weight:650;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted)}
  .tk-desc{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
  /* zona de entrega */
  .drop{
    margin-top:8px;border:1.5px dashed #c9cfe0;border-radius:var(--r-md);
    padding:20px 16px;text-align:center;cursor:pointer;background:#fcfcfe;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .drop:hover{border-color:var(--accent);background:var(--accent-soft)}
  .drop.over{border-color:var(--accent);background:var(--accent-soft);border-style:solid;transform:scale(1.01)}
  .drop-ico{
    width:38px;height:38px;border-radius:12px;margin:0 auto 9px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);
  }
  .drop.over .drop-ico{background:#fff}
  .drop-ico svg{width:18px;height:18px}
  .drop b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
  .drop span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  .drop u{color:var(--accent);text-decoration:none;font-weight:600;border-bottom:1px solid currentColor}

  .files{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .file-row{
    display:flex;align-items:center;gap:10px;padding:9px 11px;
    border:1px solid var(--line-2);border-radius:12px;background:#fff;
  }
  .file-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:var(--line-2);color:var(--ink-2);flex:none}
  .file-ico svg{width:13px;height:13px}
  .file-main{flex:1;min-width:0}
  .file-main b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-main span{font-size:11px;color:var(--muted)}
  .file-x{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
  .file-x:hover{background:var(--danger-soft);color:var(--danger)}
  .file-x svg{width:11px;height:11px}

  .tk-done{
    margin-top:8px;display:flex;align-items:center;gap:10px;padding:13px 15px;
    border-radius:var(--r-md);background:var(--ok-soft);color:var(--ok);
  }
  .tk-done svg{width:16px;height:16px;flex:none}
  .tk-done b{font-size:13.5px;font-weight:650;display:block;color:var(--ok)}
  .tk-done span{font-size:11.5px;color:#0b7d57;opacity:.85}
  .tk-redo{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--ink-2);
    border-bottom:1px solid var(--line);padding-bottom:1px;flex:none}
  .tk-redo:hover{color:var(--ink);border-color:var(--ink)}

  .tk-foot{display:flex;gap:9px;margin-top:20px}
  .btn-ghost:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost:disabled:hover{background:none;border-color:var(--line)}
  .tk-foot .primary:disabled:hover{background:var(--ink);border-color:var(--ink)}
  .tk-foot .btn-ghost{margin-top:0}
  .tk-foot .primary{
    background:var(--ink);color:#fff;border-color:var(--ink);
  }
  .tk-foot .primary:hover{background:#000;border-color:#000}
  @media (max-width:620px){
    .modal.tk{padding:20px}
    .tk-grid{grid-template-columns:1fr}
    .tk-title{font-size:18px}
  }

  /* ---------- detalle de materia ---------- */
  .card.subj[data-subj],.card.subj[data-prac]{cursor:pointer}

  /* estatus de prácticas */
  .step{display:flex;align-items:center;gap:11px;padding:10px 0}
  .step + .step{border-top:1px solid var(--line-2)}
  .step-dot{
    width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
    box-shadow:inset 0 0 0 2px var(--line);color:#fff;
  }
  .step-dot svg{width:10px;height:10px}
  .step.is-ok .step-dot{background:var(--ok);box-shadow:none}
  .step.is-pend .step-dot{box-shadow:inset 0 0 0 2px var(--warn);background:var(--warn-soft)}
  .step-main{flex:1;min-width:0}
  .step-main b{display:block;font-size:13px;font-weight:600}
  .step-main span{font-size:11.5px;color:var(--muted)}
  .step.is-next .step-main b,.step.is-next .step-main span{opacity:.6}
  #taskOverlay{z-index:55}

  .sj-top{display:flex;gap:13px;align-items:flex-start;padding-right:34px}
  .sj-ava{width:60px;height:60px;border-radius:18px;overflow:hidden;flex:none;background:#1e1c1c}
  .sj-ava svg{width:100%;height:100%;display:block}
  .sj-name{font-size:20px;font-weight:650;letter-spacing:-.03em;line-height:1.2}
  .sj-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .sj-teacher{margin-top:9px;font-size:13px;font-weight:600}
  .sj-teacher span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}

  .sj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .sj-chip{font-size:11.5px;color:var(--ink-2);background:var(--line-2);border-radius:8px;padding:4px 9px}

  .sj-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
  .sj-row + .sj-row{border-top:1px solid var(--line-2)}
  .sj-day{font-size:12.5px;font-weight:650;width:135px;flex:none}
  .sj-day span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
  .sj-place{font-size:12.5px;font-weight:600;text-align:right;margin-left:auto}
  .sj-place span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}

  .notice{display:flex;gap:10px;padding:11px 12px;border-radius:12px;margin-bottom:7px}
  .notice.info{background:var(--accent-soft)}
  .notice.warn{background:var(--warn-soft)}
  .notice-ico{width:18px;height:18px;flex:none;margin-top:1px}
  .notice.info .notice-ico{color:var(--accent)} .notice.warn .notice-ico{color:var(--warn)}
  .notice-ico svg{width:100%;height:100%}
  .notice p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
  .notice time{font-size:11px;color:var(--muted);display:block;margin-top:3px}

  .sj-item{
    display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;
    border:1px solid var(--line-2);cursor:pointer;transition:border-color .15s,background .15s;
  }
  .sj-item + .sj-item{margin-top:6px}
  .sj-item:hover{border-color:#d9deea;background:#fbfcff}
  .sj-item-main{flex:1;min-width:0}
  .sj-item-main b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sj-item-main span{font-size:11px;color:var(--muted)}
  .sj-item .cd{font-size:13px;flex:none}

  .sj-repo{
    width:100%;margin-top:16px;border:1px solid var(--line);border-radius:var(--r-md);
    padding:13px 15px;display:flex;align-items:center;gap:12px;text-align:left;
    background:#fff;transition:border-color .15s,background .15s;
  }
  .sj-repo:hover{border-color:var(--accent);background:var(--accent-soft)}
  .sj-repo-ico{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent)}
  .sj-repo:hover .sj-repo-ico{background:#fff}
  .sj-repo-ico svg{width:17px;height:17px}
  .sj-repo-t{flex:1;min-width:0}
  .sj-repo-t b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
  .sj-repo-t span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .sj-repo > svg{width:14px;height:14px;color:var(--muted);flex:none}

  .sj-avg{
    width:100%;margin-top:18px;border-radius:var(--r-md);padding:15px 17px;
    background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
    transition:transform .12s,background .15s;
  }
  .sj-avg:hover{background:#000;transform:translateY(-1px)}
  .sj-avg-l{text-align:left}
  .sj-avg-l b{display:block;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;opacity:.62}
  .sj-avg-l span{font-size:11.5px;opacity:.62}
  .sj-avg-n{margin-left:auto;font-size:28px;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .sj-avg svg{width:15px;height:15px;opacity:.7;flex:none}

  .back{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    color:var(--muted);margin-bottom:12px;padding:5px 10px 5px 7px;border-radius:9px;
    background:var(--line-2);transition:color .15s,background .15s;
  }
  .back:hover{color:var(--ink);background:#e6e9f0}
  .back svg{width:13px;height:13px;transform:rotate(180deg)}

  .gr-hero{display:flex;align-items:flex-end;gap:12px;margin:4px 0 4px}
  .gr-hero b{font-size:44px;font-weight:650;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
  .gr-hero span{font-size:12.5px;color:var(--muted);padding-bottom:6px}

  .part{padding:11px 0}
  .part + .part{border-top:1px solid var(--line-2)}
  .part-top{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
  .part-top b{font-weight:600}
  .part-top .w{color:var(--muted);font-size:11.5px}
  .part-top .g{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
  .part .track{margin-top:7px}

  .ent{display:flex;align-items:center;gap:11px;padding:10px 0}
  .ent + .ent{border-top:1px solid var(--line-2)}
  .ent-main{flex:1;min-width:0}
  .ent-main b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ent-main span{font-size:11.5px;color:var(--muted)}
  .ent-g{
    font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;flex:none;
    border-radius:9px;padding:4px 9px;background:var(--ok-soft);color:var(--ok);
  }
  .ent-g.mid{background:var(--warn-soft);color:var(--warn)}
  .ent-g.low{background:var(--danger-soft);color:var(--danger)}
  .ent-g.wait{background:var(--line-2);color:var(--muted);font-weight:600}

  /* simulador de notas */
  .sim-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
    background:var(--accent-soft);border-radius:var(--r-md);padding:11px 13px;
  }
  .sim-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--accent);border-radius:6px;padding:3px 7px}
  .sim-txt{font-size:12px;color:var(--ink-2)}
  .sim-txt b{font-variant-numeric:tabular-nums}
  .sim-txt i{font-style:normal;font-weight:650;font-variant-numeric:tabular-nums}
  .sim-txt i.up{color:var(--ok)} .sim-txt i.down{color:var(--danger)}
  .sim-clear{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--accent);
    border-bottom:1px solid currentColor;padding-bottom:1px}
  .sim-in{display:flex;align-items:center;gap:5px;flex:none}
  .sim-in input{
    width:58px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:13px;font-weight:650;text-align:center;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .sim-in input::placeholder{color:var(--muted);font-weight:500}
  .sim-in input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ent.is-sim .sim-in input{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .sim-x{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
  .sim-x:hover{background:var(--danger-soft);color:var(--danger)}
  .sim-x svg{width:10px;height:10px}

  /* ---------- bandeja de correo ---------- */
  .modal.ml-modal{
    max-width:880px;padding:0;overflow:hidden;position:relative;
    height:min(640px, 88vh);display:flex;flex-direction:column;
  }
  #mailBody{flex:1;min-height:0;display:flex}
  .ml{display:grid;grid-template-columns:236px 1fr;flex:1;min-height:0;width:100%}
  .ml-side,.ml-main{min-height:0}
  .ml-side{
    background:#fafbfd;border-right:1px solid var(--line);padding:18px 12px;
    overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  }
  .ml-title{font-size:15px;font-weight:650;letter-spacing:-.02em;padding:0 8px 12px}
  .ml-new{
    display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px;
    background:var(--ink);color:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:650;
  }
  .ml-new:hover{background:#000}
  .ml-new svg{width:14px;height:14px}
  .ml-grp{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:14px 8px 5px}
  .ml-cat{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 9px;
    border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .12s;
  }
  .ml-cat:hover{background:#eef1f6}
  .ml-cat.on{background:var(--ink);color:#fff}
  .ml-cat .n{margin-left:auto;font-size:11px;font-weight:650;opacity:.6;font-variant-numeric:tabular-nums}
  .ml-cat .dot{width:7px;height:7px;border-radius:2px;flex:none}
  .ml-cat.sub{padding-left:26px;font-weight:500;font-size:12px}
  .ml-cat svg{width:14px;height:14px;flex:none}
  .ml-cat .chev{width:11px;height:11px;margin-left:auto;transition:transform .15s;opacity:.5}
  .ml-av svg{width:15px;height:15px}
  .ml-actions .btn-ghost svg{width:14px;height:14px}
  .btn-ghost svg{flex:none}
  .ml-cat.open .chev{transform:rotate(90deg)}

  .ml-main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .ml-head{padding:18px 22px 12px;border-bottom:1px solid var(--line-2);padding-right:52px}
  .ml-head b{font-size:15px;font-weight:650;letter-spacing:-.02em;display:block}
  .ml-head span{font-size:11.5px;color:var(--muted)}
  .ml-list{overflow-y:auto;padding:6px 10px 14px;flex:1}
  .ml-msg{
    display:flex;gap:11px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;
    transition:background .12s;
  }
  .ml-msg:hover{background:#f7f9fc}
  .ml-av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
    color:#fff;font-size:12px;font-weight:650}
  .ml-msg-main{flex:1;min-width:0;display:block;overflow:hidden}
  .ml-msg-top{display:flex;align-items:baseline;gap:8px}
  .ml-msg-top b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ml-msg-top time{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
  .ml-msg-s{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ml-msg-p{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ml-msg .udot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
  .ml-tag{font-size:10px;font-weight:650;border-radius:6px;padding:2px 6px;background:var(--line-2);color:var(--muted)}

  .ml-read{padding:18px 22px;overflow-y:auto;flex:1}
  .ml-read h4{margin:10px 0 4px;font-size:17px;letter-spacing:-.02em}
  .ml-read .meta{font-size:12px;color:var(--muted);margin-bottom:14px}
  .ml-read p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0}

  .ml-form{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
  .fld label{display:block;font-size:11px;font-weight:650;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{
    width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:13.5px;color:var(--ink);
  }
  .fld textarea{min-height:150px;resize:vertical;line-height:1.55}
  .fld input:focus,.fld select:focus,.fld textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* selector de destinatario */
  .pick{position:relative}
  .pick-btn{
    width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;
    border:1px solid var(--line);background:#fff;font-size:13.5px;color:var(--muted);text-align:left;
  }
  .pick-btn.has{color:var(--ink);font-weight:600}
  .pick-btn svg{width:12px;height:12px;margin-left:auto;opacity:.5;transform:rotate(90deg);flex:none}
  .pick.open .pick-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .pick.open .pick-btn svg{transform:rotate(-90deg)}
  .pick-panel{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:4;background:#fff;
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lift);
    max-height:290px;overflow-y:auto;padding:6px;
  }
  .pick-grp{font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:9px 10px 4px}
  .pick-row,.pick-item{
    width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
    font-size:13px;font-weight:600;color:var(--ink-2);text-align:left;
  }
  .pick-row:hover,.pick-item:hover{background:#f3f5f9}
  .pick-row svg{width:11px;height:11px;margin-left:auto;opacity:.45;transition:transform .15s;flex:none}
  .pick-row.open svg{transform:rotate(90deg)}
  .pick-row .dot,.pick-item .dot{width:7px;height:7px;border-radius:2px;flex:none}
  .pick-item{font-weight:500;padding-left:26px;font-size:12.5px}
  .pick-item.on{background:var(--ink);color:#fff}
  .pick-sub{font-size:10.5px;font-weight:650;color:var(--muted);padding:7px 10px 3px 26px;
    letter-spacing:.04em;text-transform:uppercase}

  .sched-box{display:none;gap:9px;align-items:flex-end}
  .sched-box.on{display:flex}
  .ml-actions{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}
  .ml-actions .btn-ghost{margin-top:0;width:auto;padding:10px 16px}
  .ml-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ml-actions .primary:hover{background:#000;border-color:#000}

  .confirm{position:absolute;inset:0;background:rgba(15,23,42,.42);display:none;
    place-items:center;padding:24px;z-index:5}
  .confirm.on{display:grid}
  .confirm-box{background:#fff;border-radius:18px;padding:20px;max-width:340px;box-shadow:var(--shadow-lift)}
  .confirm-box b{font-size:15px;letter-spacing:-.02em}
  .confirm-box p{margin:6px 0 16px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .confirm-btns{display:flex;gap:8px}
  .confirm-btns .btn-ghost{margin-top:0}
  .btn-ghost.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn-ghost.danger:hover{background:#c03a3a;border-color:#c03a3a}

  @media (max-width:760px){
    .modal.ml-modal{max-width:100%;height:min(660px, 90vh)}
    .ml{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .ml-side{
      border-right:0;border-bottom:1px solid var(--line);flex-direction:row;
      overflow-x:auto;gap:6px;padding:14px 12px;align-items:center;
    }
    .ml-side .ml-title,.ml-side .ml-grp{display:none}
    .ml-cat{width:auto;flex:none;white-space:nowrap;background:#eef1f6}
    .ml-cat.sub{padding-left:9px}
    .ml-cat .chev{display:none}
    .ml-new{margin:0;flex:none;padding:9px 14px}
    .ml-head{padding:14px 16px 10px;padding-right:48px}
    .ml-list,.ml-read,.ml-form{padding-left:14px;padding-right:14px}
  }

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:12.5px;
    font-weight:600;opacity:0;pointer-events:none;transition:all .22s;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .col-3,.col-4,.col-5{grid-column:span 6}
    .col-7,.col-8{grid-column:span 12}
    .col-2{grid-column:span 3}
  }
  @media (max-width:620px){
    .shell{padding:14px 13px 110px}
    :root{--gap:14px}
    [class*="col-"]{grid-column:1/-1}
    .col-2{grid-column:span 6}
    .card{padding:16px;border-radius:20px}
    .types{grid-template-columns:1fr}
    .greet{display:none}
    .remove{opacity:1;transform:none}
    .card-head{padding-right:26px}
    .cal-day{flex:0 0 84px;min-width:84px}
    .cd{font-size:14px}
  }
</style>

});

/* nota de un rubro: promedio de sus evaluaciones con nota (real o simulada) */
function partGrade(f, k){
  const g = f.entries.filter(e=>e.k===k).map(e=> e.g!=null ? e.g : e.sim)
                     .filter(v=>v!=null && v!=="");
  return g.length ? g.reduce((a,b)=>a+ +b,0)/g.length : null;
}
/* promedio ponderado sobre los rubros que ya tienen nota */
function average(f, useSim){
  let sw=0, sg=0;
  f.parts.forEach(p=>{
    const g = useSim ? partGrade(f,p.k)
                     : (()=>{ const v=f.entries.filter(e=>e.k===p.k && e.g!=null).map(e=>e.g);
                              return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; })();
    if(g!=null){ sw+=p.w; sg+=p.w*g; }
  });
  return sw ? {g:sg/sw, w:sw} : {g:null, w:0};
}
const hasSim = (f) => f.entries.some(e=>e.g==null && e.sim!=null && e.sim!=="");

Object.keys(INFO).forEach(k=>{
  SUBJECTS[k].grade = average(INFO[k], false).g.toFixed(1);
});

/* ============ helpers ============ */
const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MON = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const el = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const sameDay = (a,b) => a.getDate()===b.getDate() && a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear();
const tasksOn = (d) => TASKS.map((t,i)=>({t,i})).filter(x=>sameDay(new Date(x.t.due), d));
const hhmm = (ts) => { const d=new Date(ts);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

function urgency(ms){
  if(ms < D) return "danger";
  if(ms < 3*D) return "warn";
  return "ok";
}
function urgColor(u){ return u==="danger"?"var(--danger)":u==="warn"?"var(--warn)":"var(--ok)"; }

function fmtDue(ts){
  const d = new Date(ts);
  return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()].slice(0,3)+", "+
         String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtLong(ts){
  const d = new Date(ts);
  return DOW[d.getDay()]+" "+d.getDate()+" de "+MON[d.getMonth()]+" de "+d.getFullYear()+", "+hhmm(ts);
}
function hace(ts){
  const dd = Math.floor((Date.now()-ts)/D);
  return dd<=0 ? "hoy" : dd===1 ? "hace 1 día" : "hace "+dd+" días";
}

function head(icon, title, sub, extra){
  return '<div class="card-head"><span class="glyph">'+icon+'</span>'+
    '<div><div class="card-title">'+esc(title)+'</div>'+
    (sub?'<div class="card-sub">'+esc(sub)+'</div>':'')+'</div>'+
    '<span class="spacer"></span>'+(extra||'')+'</div>';
}

function buildCalendar(){
  const today = new Date();
  const days = Array.from({length:21},(_,i)=>{
    const d = new Date(today); d.setDate(today.getDate()+i); return d;
  });
  const strip = days.map((d,i)=>{
    const evs = (EVENTS[i%7]||[]).map(e=>'<span class="cal-ev" style="'+
        (i===selDay?'':'background:'+SUBJECTS[e.s].color+'1a;color:'+SUBJECTS[e.s].color)+'">'+esc(e.n)+'</span>').join("")
      + tasksOn(d).map(({t,i:ti})=>'<span class="cal-ev is-task" data-task="'+ti+'" title="'+esc(t.title)+'" style="'+
        (i===selDay?'':'color:'+SUBJECTS[t.subject].color+';box-shadow:inset 0 0 0 1px '+SUBJECTS[t.subject].color+'59')+
        '">'+I.dot+esc(t.title.split(" — ")[0])+'</span>').join("");
    return '<button class="cal-day'+(i===0?' is-today':'')+(i===selDay?' is-sel':'')+'" data-day="'+i+'">'+
      '<span class="cal-dow">'+DOW[d.getDay()]+'</span>'+
      '<span class="cal-num">'+String(d.getDate()).padStart(2,"0")+'</span>'+
      '<span class="cal-evs">'+evs+'</span>'+
    '</button>';
  }).join("");

  const sel = days[selDay];
  const list = (EVENTS[selDay%7]||[])
    .map(e=>({t:e.t, n:e.n, w:e.w, s:e.s, kind:"clase"}))
    .concat(tasksOn(sel).map(({t,i})=>({
      t:hhmm(t.due), n:t.title, w:SUBJECTS[t.subject].name, s:t.subject, kind:"entrega", idx:i
    })))
    .sort((a,b)=>a.t.localeCompare(b.t));

  const detail = list.length
    ? list.map(e=>'<div class="cal-row"'+(e.kind==="entrega"?' data-task="'+e.idx+'" role="button" tabindex="0"':'')+'>'+
        '<span class="cal-time">'+e.t+'</span>'+
        '<span class="cal-bar" style="background:'+SUBJECTS[e.s].color+(e.kind==="entrega"?';opacity:.45':'')+'"></span>'+
        '<span class="cal-info"><b>'+esc(e.n)+'</b><span>'+esc(e.w)+'</span></span>'+
        (e.kind==="entrega"?'<span class="pill warn" style="margin-left:auto">entrega</span>':'')+
      '</div>').join("")
    : '<div class="cal-empty">Sin clases ni entregas este día.</div>';

  return head(I.cal, "Calendario", MON[sel.getMonth()]+" "+sel.getFullYear(),
              '<button class="btn-today'+(selDay===0?" is-now":"")+'" data-today'+(selDay===0?" disabled":"")+'>'+
                I.today+(selDay===0?"Hoy":"Ir a hoy")+'</button>')+
    '<div class="cal-wrap"><div class="cal-strip">'+strip+'</div></div>'+
    '<div class="cal-detail"><h4>'+(selDay===0?"Hoy":DOW[sel.getDay()]+" "+sel.getDate()+" de "+MON[sel.getMonth()])+'</h4>'+detail+'</div>';
}

function buildTasks(){
  const rows = TASKS.map((t,i)=>({t,i})).sort((a,b)=>a.t.due-b.t.due).map(({t,i})=>{
    const s = SUBJECTS[t.subject];
    const left = t.due - Date.now();
    const u = urgency(left);
    const pct = Math.max(4, Math.min(100, 100 - (left/t.total)*100));
    return '<div class="task" data-task="'+i+'" role="button" tabindex="0">'+
      '<span class="task-bar" style="background:'+s.color+'"></span>'+
      '<span class="task-main">'+
        '<span class="task-name">'+esc(t.title)+'</span>'+
        '<span class="task-sub">'+esc(s.name)+'<i class="dot"></i>'+esc(s.code)+'</span>'+
        '<span class="track"><i style="width:'+pct.toFixed(0)+'%;background:'+urgColor(u)+'"></i></span>'+
      '</span>'+
      '<span class="task-count">'+
        '<span class="cd is-'+u+'" data-due="'+t.due+'"></span>'+
        '<span class="task-when">'+fmtDue(t.due)+'</span>'+
      '</span>'+
    '</div>';
  }).join("");
  const urgent = TASKS.filter(t=>t.due-Date.now() < D).length;
  return head(I.task, "Tareas pendientes", TASKS.length+" activas",
        urgent?'<span class="pill danger">'+urgent+' urgente'+(urgent>1?'s':'')+'</span>':'<span class="pill ok">al día</span>')+rows;
}

/* rueda del mouse = desplazamiento lateral en el calendario */
let stripLeft = 0;
function setupStrip(){
  const strip = document.querySelector(".cal-strip");
  if(!strip) { stripLeft = 0; return; }
  strip.scrollLeft = stripLeft;                       // conserva la posición al re-renderizar
  strip.addEventListener("scroll", ()=>{ stripLeft = strip.scrollLeft; }, {passive:true});
  strip.addEventListener("wheel", e=>{
    const max = strip.scrollWidth - strip.clientWidth;
    if(max <= 0) return;                              // no hay nada que desplazar
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!d) return;
    const next = Math.max(0, Math.min(max, strip.scrollLeft + d));
    if(next === strip.scrollLeft) return;             // en el borde: deja pasar el scroll de la página
    strip.scrollLeft = next;
    e.preventDefault();
  }, {passive:false});
}

/* ============ countdown ============ */
function tick(){
  document.querySelectorAll(".cd").forEach(n=>{
    let ms = +n.dataset.due - Date.now();
    if(ms <= 0){ n.textContent = "Vencida"; n.className="cd is-danger"; return; }
    const d = Math.floor(ms/D), h = Math.floor(ms%D/H), m = Math.floor(ms%H/6e4), s = Math.floor(ms%6e4/1000);
    n.innerHTML = d>0
      ? d+'<small>d</small> '+h+'<small>h</small> '+m+'<small>m</small>'
      : h+'<small>h</small> '+m+'<small>m</small> '+s+'<small>s</small>';
    n.className = "cd is-"+urgency(ms);
  });
}

function mailMatch(m, f){
  if(f==="all")  return true;
  if(f==="inst") return !!m.inst;
  if(f.startsWith("g:")) return m.grp===+f.slice(2);
  if(f.startsWith("s:")) return m.sub===f.slice(2);
  if(f.startsWith("p:")) return m.prac===f.slice(2);
  return false;
}
const mailCount = (f) => MAILS.filter(m=>mailMatch(m,f)).length;

  if(f.startsWith("g:")) return {t:GROUPS[+f.slice(2)].name, s:mailCount(f)+" mensajes · grupo"};
  if(f.startsWith("p:")){ const p=PRACTICES[f.slice(2)];
    return {t:p.name, s:mailCount(f)+" mensajes · "+p.place}; }
  const sub = f.slice(2);
  return {t:SUBJECTS[sub].name, s:mailCount(f)+" mensajes · "+SUBJECTS[sub].code};
}

function renderMailModal(){
  mailBody.innerHTML = '<div class="ml">'+mailSidebar()+mailMain()+'</div>';
}
function openMail(){ mailView="list"; mailRead=null; renderMailModal(); mailOverlay.classList.add("open"); }

const draftDirty = () => mailView==="compose" &&
  (draft.to.trim() || draft.subject.trim() || draft.body.trim());

function saveDraftFromForm(){
  const g = id => document.getElementById(id);
  if(g("cSubject")) draft.subject = g("cSubject").value;
  if(g("cBody"))    draft.body    = g("cBody").value;
  if(g("cWhen"))    draft.when    = g("cWhen").value;
}
function clearDraft(){ draft = {to:"", subject:"", body:"", when:""}; }

/* pide confirmación si hay un mensaje empezado */
function guard(action){
  saveDraftFromForm();
  if(draftDirty()){ pendingClose = action; mailConfirm.classList.add("on"); return; }
  action();
}
function closeMail(){ mailOverlay.classList.remove("open"); mailConfirm.classList.remove("on"); }

mailConfirm.addEventListener("click", e=>{
  if(e.target.closest("[data-keep]") || e.target===mailConfirm){
    mailConfirm.classList.remove("on"); pendingClose=null; return;
  }
  if(e.target.closest("[data-discard]")){
    mailConfirm.classList.remove("on");
    clearDraft(); mailView="list";
    const a = pendingClose; pendingClose=null;
    if(a) a(); else renderMailModal();
  }
});

document.getElementById("mailClose").addEventListener("click", ()=>guard(closeMail));
mailOverlay.addEventListener("click", e=>{ if(e.target===mailOverlay) guard(closeMail); });

mailBody.addEventListener("click", e=>{
  /* --- selector de destinatario --- */
  if(e.target.closest("[data-picktoggle]")){
    saveDraftFromForm(); pickOpen = !pickOpen; renderMailModal(); return;
  }
  const ps = e.target.closest("[data-picksubj]");
  if(ps){ saveDraftFromForm();
          pickSubj = pickSubj===ps.dataset.picksubj ? null : ps.dataset.picksubj;
          renderMailModal(); return; }
  const to = e.target.closest("[data-to]");
  if(to){ saveDraftFromForm(); draft.to = to.dataset.to;
          pickOpen=false; renderMailModal(); return; }
  if(pickOpen && !e.target.closest(".pick")){ saveDraftFromForm(); pickOpen=false; renderMailModal(); }

  const f = e.target.closest("[data-f]");
  if(f){ const v=f.dataset.f;
    guard(()=>{ mailFilter=v; mailView="list"; mailRead=null; renderMailModal(); });
    return; }

  const o = e.target.closest("[data-open]");
  if(o){ const m = MAILS.find(x=>x.id===+o.dataset.open);
         m.unread=false; mailRead=m; mailView="read"; renderMailModal(); renderMail(); return; }

  if(e.target.closest("[data-list]")){ mailView="list"; mailRead=null; renderMailModal(); return; }
  if(e.target.closest("[data-compose]")){ guard(()=>{ mailView="compose"; renderMailModal(); }); return; }

  const r = e.target.closest("[data-reply]");
  if(r){ const m = MAILS.find(x=>x.id===+r.dataset.reply);
         draft = {to:m.from, subject:"Re: "+m.s, body:"", when:""};
         mailView="compose"; renderMailModal(); return; }

  if(e.target.closest("[data-schedtoggle]")){
    saveDraftFromForm();
    if(draft.when){ draft.when=""; }
    else {
      const d = new Date(Date.now()+D);
      d.setMinutes(0,0,0);
      draft.when = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0")+"T08:00";
    }
    renderMailModal(); return;
  }

  if(e.target.closest("[data-cancel]")){ guard(()=>{ mailView="list"; renderMailModal(); }); return; }

  const us = e.target.closest("[data-unsched]");
  if(us){ scheduled.splice(+us.dataset.unsched,1); renderMailModal(); toast("Envío cancelado"); return; }

  if(e.target.closest("[data-send]")){
    saveDraftFromForm();
    if(!draft.to){ toast("Elegí un destinatario"); return; }
    if(!draft.body.trim()){ toast("El mensaje está vacío"); return; }
    if(draft.when){
      scheduled.push({to:draft.to, subject:draft.subject, body:draft.body, at:new Date(draft.when).getTime()});
      toast("Envío programado para "+fmtDue(new Date(draft.when).getTime()));
      mailFilter="sched";
    } else {
      toast("Mensaje enviado");
      mailFilter="all";
    }
    clearDraft(); mailView="list"; renderMailModal();
  }
});

function openGrades(key){
  const s = SUBJECTS[key], f = INFO[key];
  const real = average(f, false), proj = average(f, true);
  const sim  = hasSim(f);
  const diff = sim ? proj.g - real.g : 0;
  const nameOf = (k) => (f.parts.find(p=>p.k===k)||{}).l || "";

  const graded = f.entries.filter(e=>e.g!=null).sort((a,b)=>b.d-a.d);
  const pend   = f.entries.filter(e=>e.g==null).sort((a,b)=>a.d-b.d);

  infoBody.innerHTML =
    '<button class="back" data-back="'+key+'">'+I.arrow+esc(s.name)+'</button>'+

    '<div class="sj-sub" style="margin:0">Promedio del semestre · '+esc(s.code)+'</div>'+
    '<div class="gr-hero">'+
      '<b style="color:'+(sim?"var(--accent)":s.color)+'">'+(sim?proj.g:real.g).toFixed(1)+'</b>'+
      '<span>sobre 10 · '+(sim?proj.w:real.w)+'% evaluado</span>'+
    '</div>'+
    (sim
      ? '<div class="sim-bar">'+
          '<span class="sim-tag">simulado</span>'+
          '<span class="sim-txt">Sin las notas simuladas tu promedio es <b>'+real.g.toFixed(1)+'</b> '+
            '<i class="'+(diff>=0?"up":"down")+'">'+(diff>=0?"▲ +":"▼ ")+diff.toFixed(1)+'</i></span>'+
          '<button class="sim-clear" data-simclear="'+key+'">Volver a sin calificar</button>'+
        '</div>'
      : '')+

    '<div class="tk-h">Cómo se compone el promedio</div>'+
    f.parts.map(p=>{
      const gReal = (()=>{ const v=f.entries.filter(e=>e.k===p.k && e.g!=null).map(e=>e.g);
                           return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; })();
      const gSim  = partGrade(f, p.k);
      const isSim = gReal==null ? gSim!=null : (gSim!=null && Math.abs(gSim-gReal)>0.001);
      const g = gSim;
      return '<div class="part">'+
        '<div class="part-top"><b>'+esc(p.l)+'</b><span class="w">'+p.w+'% del total</span>'+
          '<span class="g"'+(isSim?' style="color:var(--accent)"':'')+'>'+
            (g==null ? '<span class="w">sin calificar</span>' : g.toFixed(1))+'</span></div>'+
        '<div class="track"><i style="width:'+(g==null?0:(g*10).toFixed(0))+
          '%;background:'+(isSim?"var(--accent)":s.color)+'"></i></div>'+
      '</div>';
    }).join("")+

    '<div class="tk-h">Entregas calificadas</div>'+
    (graded.length ? graded.map(e=>'<div class="ent">'+
        '<span class="ent-main"><b>'+esc(e.n)+'</b><span>'+fmtLong(e.d).split(",")[0]+' · '+esc(nameOf(e.k))+'</span></span>'+
        '<span class="ent-g'+gradeClass(e.g)+'">'+e.g.toFixed(1)+'</span>'+
      '</div>').join("") : '<div class="cal-empty">Todavía no hay notas registradas.</div>')+

    '<div class="tk-h">Entregas futuras · simulá una nota para ver el escenario</div>'+
    (pend.length ? pend.map((e,i)=>{
      const idx = f.entries.indexOf(e);
      const on = e.sim!=null && e.sim!=="";
      return '<div class="ent'+(on?" is-sim":"")+'">'+
        '<span class="ent-main"><b>'+esc(e.n)+'</b><span>'+fmtDue(e.d)+' · '+esc(nameOf(e.k))+'</span></span>'+
        '<span class="sim-in">'+
          '<input type="number" min="0" max="10" step="0.1" placeholder="—" inputmode="decimal" '+
            'data-sim="'+key+':'+idx+'" value="'+(on?e.sim:"")+'" aria-label="Nota simulada">'+
          (on?'<button class="sim-x" data-simx="'+key+':'+idx+'" aria-label="Quitar nota simulada">'+I.x+'</button>':'')+
        '</span>'+
      '</div>';
    }).join("") : '<div class="cal-empty">Sin entregas programadas.</div>')+

    '<div class="tk-foot"><button class="btn-ghost" data-close>Cerrar</button></div>';
}

  currentTask = i;
  const s = SUBJECTS[t.subject];
  const left = t.due - Date.now();
  const u = left <= 0 ? "danger" : urgency(left);
  const pct = Math.max(0, Math.min(100, 100 - (left/t.total)*100));

  document.getElementById("tkBody").innerHTML =
    '<div class="tk-kicker">'+
      '<span class="subj-dot" style="background:'+s.color+'"></span>'+
      '<b>'+esc(s.name)+'</b><span>'+esc(s.code)+'</span>'+
      '<span class="pill" style="margin-left:auto">'+esc(t.type)+'</span>'+
    '</div>'+
    '<div class="tk-title">'+esc(t.title)+'</div>'+

    '<div class="tk-cd is-'+u+'">'+
      '<div>'+
        '<div class="tk-cd-lbl">'+(left<=0?"Plazo vencido":"Tiempo restante")+'</div>'+
        '<div class="cd is-'+u+'" data-due="'+t.due+'"></div>'+
      '</div>'+
      '<div class="tk-cd-right"><b>'+fmtDue(t.due)+'</b><span>fecha de entrega</span></div>'+
    '</div>'+

    '<div class="track" style="margin-top:10px"><i style="width:'+pct.toFixed(0)+'%;background:'+urgColor(u)+'"></i></div>'+

    '<div class="tk-grid">'+
      '<div class="tk-cell"><span>Publicada · '+hace(t.published)+'</span><b>'+fmtLong(t.published)+'</b></div>'+
      '<div class="tk-cell"><span>Entrega</span><b>'+fmtLong(t.due)+'</b></div>'+
      '<div class="tk-cell"><span>Docente</span><b>'+esc(t.teacher)+'</b></div>'+
      '<div class="tk-cell"><span>Modalidad</span><b>'+esc(t.mode)+'</b></div>'+
      '<div class="tk-cell"><span>Dónde</span><b>'+esc(t.where)+'</b></div>'+
      '<div class="tk-cell"><span>Ponderación</span><b>'+t.points+' puntos · '+esc(t.attempts)+'</b></div>'+
    '</div>'+

    '<div class="tk-h">Descripción</div>'+
    '<div class="tk-desc">'+esc(t.desc)+'</div>'+

    '<div class="tk-h">Tu entrega</div>'+
    '<div id="tkSubmitBox">'+renderSubmit(i)+'</div>';

  taskOverlay.classList.add("open");
  wireDrop();
  tick();
}

/* --- entrega de archivos --- */
const submissions = {};
const subOf = (i) => submissions[i] || (submissions[i] = {files:[], at:null});
const fmtSize = (b) => b >= 1048576 ? (b/1048576).toFixed(1)+" MB"
                     : b >= 1024 ? Math.round(b/1024)+" KB" : b+" B";

function renderSubmit(i){
  const s = subOf(i);

  if(s.at){
    return '<div class="tk-done">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>'+
        '<div><b>Entregado</b><span>'+fmtDue(s.at)+' · '+s.files.length+
          (s.files.length===1?' archivo':' archivos')+'</span></div>'+
        '<button class="tk-redo" data-redo>Reemplazar entrega</button>'+
      '</div>'+ fileList(s.files, false)+
      '<div class="tk-foot"><button class="btn-ghost" data-close>Cerrar</button></div>';
  }

  return '<div class="drop" id="tkDrop">'+
      '<div class="drop-ico">'+I.upload+'</div>'+
      '<b>Arrastra tu archivo aquí</b>'+
      '<span>o <u>búscalo en tu computadora</u> · PDF, imagen, ZIP · hasta 25 MB</span>'+
      '<input type="file" id="tkFile" multiple hidden>'+
    '</div>'+
    fileList(s.files, true)+
    '<div class="tk-foot">'+
      '<button class="btn-ghost primary" data-send'+(s.files.length?'':' disabled')+'>'+
        (s.files.length? 'Entregar '+s.files.length+(s.files.length===1?' archivo':' archivos') : 'Entregar')+
      '</button>'+
      '<button class="btn-ghost" data-close style="max-width:120px">Cerrar</button>'+
    '</div>';
}

function fileList(files, editable){
  if(!files.length) return "";
  return '<div class="files">'+files.map((f,n)=>
    '<div class="file-row">'+
      '<span class="file-ico">'+I.file+'</span>'+
      '<span class="file-main"><b>'+esc(f.name)+'</b><span>'+fmtSize(f.size)+'</span></span>'+
      (editable?'<button class="file-x" data-rm="'+n+'" aria-label="Quitar archivo">'+I.x+'</button>':'')+
    '</div>').join("")+'</div>';
}

function refreshSubmit(){
  const box = document.getElementById("tkSubmitBox");
  if(!box || currentTask===null) return;
  box.innerHTML = renderSubmit(currentTask);
  wireDrop();
}

function addFiles(list){
  const s = subOf(currentTask);
  [...list].forEach(f=>{
    if(!s.files.some(x=>x.name===f.name && x.size===f.size))
      s.files.push({name:f.name, size:f.size});
  });
  refreshSubmit();
}

function wireDrop(){
  const drop = document.getElementById("tkDrop");
  if(!drop) return;
  const input = document.getElementById("tkFile");
  drop.addEventListener("click", ()=>input.click());
  input.addEventListener("change", e=>{ addFiles(e.target.files); input.value=""; });
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); drop.classList.add("over");
  }));
  ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev, e=>{
    e.preventDefault(); drop.classList.remove("over");
  }));
  drop.addEventListener("drop", e=>{
    e.preventDefault(); e.stopPropagation(); drop.classList.remove("over");
    if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
}

// evita que el navegador abra el archivo si se suelta fuera de la zona
["dragover","drop"].forEach(ev=>window.addEventListener(ev, e=>{
  if(!e.target.closest?.("#tkDrop")) e.preventDefault();
}));

document.getElementById("tkBody").addEventListener("click", e=>{
  const rm = e.target.closest("[data-rm]");
  if(rm){ subOf(currentTask).files.splice(+rm.dataset.rm,1); refreshSubmit(); return; }
  if(e.target.closest("[data-redo]")){ subOf(currentTask).at = null; refreshSubmit(); return; }
  const send = e.target.closest("[data-send]");
  if(send && !send.disabled){
    const s = subOf(currentTask);
    if(!s.files.length) return;
    s.at = Date.now();
    refreshSubmit();
    toast("Entrega enviada · "+s.files.length+(s.files.length===1?" archivo":" archivos"));
  }
});
function closeTaskDetail(){ taskOverlay.classList.remove("open"); }

taskOverlay.addEventListener("click", e=>{
  if(e.target===taskOverlay || e.target.closest("[data-close]")) closeTaskDetail();
});
document.getElementById("tkClose").addEventListener("click", closeTaskDetail);

/* ============ modal ============ */
const overlay = document.getElementById("overlay");

function openModal(){
  const used = new Set(widgets.map(w=>w.type));
  document.getElementById("typeList").innerHTML = Object.entries(TYPES).map(([k,t])=>{
    const off = t.unique && used.has(k);
    return '<button class="type" data-type="'+k+'"'+(off?' disabled':'')+'>'+
      '<span class="glyph">'+t.icon+'</span>'+
      '<span class="type-txt"><b>'+t.label+'</b><span>'+(off?"Ya está en tu inicio":t.desc)+'</span></span>'+
    '</button>';
  }).join("");
  overlay.classList.add("open");
}
function closeModal(){ overlay.classList.remove("open"); }

overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){                       // cierra solo la capa de arriba
    if(mailOverlay.classList.contains("open")){
      if(mailConfirm.classList.contains("on")){ mailConfirm.classList.remove("on"); pendingClose=null; }
      else guard(closeMail);
    }
    else if(taskOverlay.classList.contains("open")) closeTaskDetail();
    else if(infoOverlay.classList.contains("open")) closeInfo();
    else closeModal();
  }
  if(e.key==="Enter"||e.key===" "){
    const a = document.activeElement;
    if(a?.dataset?.task) { e.preventDefault(); openTaskDetail(+a.dataset.task); }
    else if(a?.dataset?.subj){ e.preventDefault(); openSubject(a.dataset.subj); }
  }
});

document.getElementById("typeList").addEventListener("click", e=>{
  const b = e.target.closest(".type"); if(!b || b.disabled) return;
  const type = b.dataset.type;
  const w = {id:"w"+(++uid), type, size:TYPES[type].size};
  widgets.push(w);
  closeModal();
  renderWidgets();
  toast("Widget de "+TYPES[type].label.toLowerCase()+" agregado");
});

/* ============ interacción ============ */
document.getElementById("widgetGrid").addEventListener("click", e=>{
  const tk = e.target.closest("[data-task]");
  if(tk){ e.stopPropagation(); openTaskDetail(+tk.dataset.task); return; }

  const sj = e.target.closest("[data-subj]");
  if(sj){ openSubject(sj.dataset.subj); return; }

  const pr = e.target.closest("[data-prac]");
  if(pr){ openPractice(pr.dataset.prac); return; }

  const x = e.target.closest("[data-x]");
  if(x){
    const card = x.closest(".card");
    widgets = widgets.filter(w=>w.id!==card.dataset.id);
    card.style.transition="opacity .16s,transform .16s";
    card.style.opacity="0"; card.style.transform="scale(.97)";
    setTimeout(()=>{ renderWidgets(); toast("Widget eliminado"); },150);
    return;
  }
  if(e.target.closest("[data-today]")){        // volver al día de hoy
    selDay = 0; stripLeft = 0; renderWidgets(); return;
  }
  const day = e.target.closest("[data-day]");
  if(day){ selDay = +day.dataset.day; renderWidgets(); }
});

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1900);
}

/* ============ init ============ */
(function init(){
  const h = new Date().getHours();
  document.getElementById("greet").textContent =
    (h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches")+", "+student.name.split(" ")[0];
  renderIdentity();
  renderMail();
  renderWidgets();
  document.getElementById("mailCard").addEventListener("click", openMail);
  document.getElementById("mailCard").style.cursor = "pointer";
})();
</script>
